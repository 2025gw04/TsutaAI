openapi: 3.0.3
info:
  title: TsutaAI Backend API
  description: |
    TsutaAI プロジェクト・タスク管理システム バックエンドAPI

    ## 認証について
    ほとんどのエンドポイントはJWT認証が必要です。
    `/auth/login`でトークンを取得し、Authorizationヘッダーに`Bearer {token}`形式で含めてください。

    ## AI機能について
    本システムはGroq APIを使用したAI機能を提供します。
    詳細は[AI利用開示](/docs/AI-USAGE-DISCLOSURE.md)をご確認ください。
  version: 1.0.0
  contact:
    name: TsutaAI Support
  license:
    name: Proprietary
    url: https://github.com/yourusername/TsutaAI/blob/main/LICENSE

servers:
  - url: http://localhost:3001
    description: ローカル開発環境
  - url: https://localhost:3443
    description: ローカル開発環境 (HTTPS)
  - url: https://api.tsutaai.example.com
    description: 本番環境

tags:
  - name: auth
    description: 認証関連エンドポイント
  - name: users
    description: ユーザー管理
  - name: projects
    description: プロジェクト管理
  - name: tasks
    description: タスク管理
  - name: worklogs
    description: 作業ログ管理
  - name: ai
    description: AI機能（Groq API連携）
  - name: health
    description: ヘルスチェック・監視

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT トークンによる認証

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: エラーが発生しました
        errorId:
          type: string
          example: ERR-1234567890-abc123
          description: 本番環境でのみ返却されるエラーID
        error:
          type: string
          description: 開発環境でのみ返却されるエラーメッセージ
        stack:
          type: string
          description: 開発環境でのみ返却されるスタックトレース

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: testuser
        email:
          type: string
          format: email
          example: user@example.com
        displayName:
          type: string
          example: テストユーザー
        role:
          type: string
          enum: [admin, member, viewer]
          example: member
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 新規Webサイト開発
        description:
          type: string
          example: コーポレートサイトのリニューアル
        status:
          type: string
          enum: [planning, active, on_hold, completed, cancelled]
          example: active
        startDate:
          type: string
          format: date
          example: "2025-01-01"
        endDate:
          type: string
          format: date
          example: "2025-12-31"
        ownerId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: integer
          example: 1
        projectId:
          type: integer
          example: 1
        title:
          type: string
          example: デザインモックアップ作成
        description:
          type: string
          example: トップページのデザインモックアップを作成
        status:
          type: string
          enum: [todo, in_progress, review, done, cancelled]
          example: in_progress
        priority:
          type: string
          enum: [low, medium, high, urgent]
          example: high
        assigneeId:
          type: integer
          nullable: true
          example: 2
        estimatedHours:
          type: number
          format: float
          example: 8.5
        actualHours:
          type: number
          format: float
          example: 6.0
        dueDate:
          type: string
          format: date
          nullable: true
          example: "2025-01-15"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Worklog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        taskId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        hours:
          type: number
          format: float
          example: 2.5
        description:
          type: string
          example: デザインラフの作成
        workDate:
          type: string
          format: date
          example: "2025-01-10"
        createdAt:
          type: string
          format: date-time

    AIAnalysisRequest:
      type: object
      required:
        - projectId
        - analysisType
      properties:
        projectId:
          type: integer
          example: 1
        analysisType:
          type: string
          enum: [task_suggestion, risk_analysis, resource_optimization, timeline_prediction]
          example: task_suggestion
        context:
          type: string
          example: 現在の進捗状況を考慮して次に必要なタスクを提案してください

    AIAnalysisResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        analysis:
          type: object
          properties:
            type:
              type: string
              example: task_suggestion
            result:
              type: string
              example: 次のタスクとして、APIエンドポイントの実装を推奨します...
            suggestions:
              type: array
              items:
                type: string
              example: ["認証機能の実装", "データベース設計の見直し"]
            timestamp:
              type: string
              format: date-time

paths:
  # ========================================
  # 認証エンドポイント
  # ========================================
  /auth/login:
    post:
      tags:
        - auth
      summary: ログイン
      description: ユーザー名とパスワードでログインし、JWTトークンを取得
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: testuser
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ログインに成功しました
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: レート制限超過
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログイン試行回数が多すぎます。しばらく待ってから再試行してください。

  /auth/register:
    post:
      tags:
        - auth
      summary: ユーザー登録
      description: 新規ユーザーを登録
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  example: newuser
                email:
                  type: string
                  format: email
                  example: newuser@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: securepassword123
                displayName:
                  type: string
                  example: 新規ユーザー
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: ユーザー登録が完了しました
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify:
    get:
      tags:
        - auth
      summary: トークン検証
      description: JWTトークンの有効性を確認
      operationId: verifyToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: トークン有効
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: トークン無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========================================
  # プロジェクトエンドポイント
  # ========================================
  /projects:
    get:
      tags:
        - projects
      summary: プロジェクト一覧取得
      description: すべてのプロジェクトを取得（ページネーション対応）
      operationId: getProjects
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [planning, active, on_hold, completed, cancelled]
        - name: search
          in: query
          schema:
            type: string
          description: プロジェクト名で検索
      responses:
        '200':
          description: プロジェクト一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 50
                      totalPages:
                        type: integer
                        example: 3
        '401':
          description: 認証エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - projects
      summary: プロジェクト作成
      description: 新規プロジェクトを作成
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: 新規プロジェクト
                description:
                  type: string
                  example: プロジェクトの説明
                status:
                  type: string
                  enum: [planning, active, on_hold, completed, cancelled]
                  default: planning
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '201':
          description: プロジェクト作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{id}:
    get:
      tags:
        - projects
      summary: プロジェクト詳細取得
      description: 指定したIDのプロジェクト詳細を取得
      operationId: getProjectById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: プロジェクト詳細
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'
        '404':
          description: プロジェクトが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - projects
      summary: プロジェクト更新
      description: プロジェクト情報を更新
      operationId: updateProject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [planning, active, on_hold, completed, cancelled]
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  project:
                    $ref: '#/components/schemas/Project'

    delete:
      tags:
        - projects
      summary: プロジェクト削除
      description: プロジェクトを削除（管理者のみ）
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: プロジェクトを削除しました

  # ========================================
  # タスクエンドポイント
  # ========================================
  /tasks:
    get:
      tags:
        - tasks
      summary: タスク一覧取得
      description: タスク一覧を取得（フィルタ・ページネーション対応）
      operationId: getTasks
      security:
        - bearerAuth: []
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
          description: プロジェクトIDでフィルタ
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, review, done, cancelled]
        - name: assigneeId
          in: query
          schema:
            type: integer
          description: 担当者IDでフィルタ
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: タスク一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

    post:
      tags:
        - tasks
      summary: タスク作成
      description: 新規タスクを作成
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - title
              properties:
                projectId:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: 新しいタスク
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, review, done, cancelled]
                  default: todo
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                  default: medium
                assigneeId:
                  type: integer
                  nullable: true
                estimatedHours:
                  type: number
                  format: float
                dueDate:
                  type: string
                  format: date
      responses:
        '201':
          description: タスク作成成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  task:
                    $ref: '#/components/schemas/Task'

  # ========================================
  # AI機能エンドポイント
  # ========================================
  /ai/analyze:
    post:
      tags:
        - ai
      summary: AI分析実行
      description: Groq APIを使用してプロジェクトを分析
      operationId: analyzeWithAI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIAnalysisRequest'
      responses:
        '200':
          description: 分析成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIAnalysisResponse'
        '429':
          description: AI APIレート制限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI APIサービス利用不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ========================================
  # ヘルスチェックエンドポイント
  # ========================================
  /health:
    get:
      tags:
        - health
      summary: 基本ヘルスチェック
      description: アプリケーションとデータベースの状態を確認
      operationId: healthCheck
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  database:
                    type: string
                    example: connected
                  uptime:
                    type: integer
                    example: 3600
                    description: アップタイム（秒）
        '500':
          description: 異常
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  status:
                    type: string
                    example: unhealthy
                  database:
                    type: string
                    example: disconnected

  /health/readiness:
    get:
      tags:
        - health
      summary: Readinessプローブ
      description: アプリケーションがリクエストを受け付ける準備ができているか
      operationId: readinessCheck
      responses:
        '200':
          description: 準備完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: ok
        '503':
          description: 準備未完了
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not ready
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: failed

  /health/liveness:
    get:
      tags:
        - health
      summary: Livenessプローブ
      description: アプリケーションが生存しているか
      operationId: livenessCheck
      responses:
        '200':
          description: 生存中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: integer
                    example: 3600

  /health/status:
    get:
      tags:
        - health
      summary: 詳細ステータス
      description: システムの詳細な状態情報
      operationId: detailedStatus
      responses:
        '200':
          description: ステータス情報
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: integer
                  system:
                    type: object
                    properties:
                      platform:
                        type: string
                        example: linux
                      nodeVersion:
                        type: string
                        example: v18.19.0
                      totalMemory:
                        type: integer
                      freeMemory:
                        type: integer
                      cpuCount:
                        type: integer
                  process:
                    type: object
                    properties:
                      pid:
                        type: integer
                      memory:
                        type: object
                      cpu:
                        type: object
                  metrics:
                    type: object
                    properties:
                      requests:
                        type: object
                        properties:
                          total:
                            type: integer
                          success:
                            type: integer
                          errors:
                            type: integer
                      averageResponseTime:
                        type: integer
                        description: 平均レスポンスタイム（ミリ秒）

  /health/metrics:
    get:
      tags:
        - health
      summary: Prometheusメトリクス
      description: Prometheus形式のメトリクス情報
      operationId: prometheusMetrics
      responses:
        '200':
          description: メトリクス情報
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP tsutaai_uptime_seconds Application uptime in seconds
                  # TYPE tsutaai_uptime_seconds gauge
                  tsutaai_uptime_seconds 3600
